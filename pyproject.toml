[project]
name = "codebase-memory-graph"
version = "0.1.0"
description = "Relationship-aware memory for coding agents, built on the Relate embedded graph database."
requires-python = ">=3.9"
dependencies = ["relate-db>=1.1.0"]

[project.scripts]
cmg = "cmg.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
